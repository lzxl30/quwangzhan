<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>趣网站 | 有趣网站导航</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    /* 保持你之前的完整 CSS 不变 */
    :root { /* ... 变量 ... */ }
    body.light-mode { /* ... */ }
    /* ... 所有原有样式 ... */
    /* 在 appearance-panel 底部增加配置管理区域的样式 */
    .config-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .config-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .config-btn:hover { background: var(--primary); color: #fff; }
    #importFileInput { display: none; }
  </style>
</head>
<body>
  <!-- 原有 HTML 结构保持不变，只需在 appearance-panel 中添加配置管理部分 -->
  <!-- 在现有 appearance-panel 的最后，panel-row 的下面追加 -->
  <div class="appearance-panel" id="appearancePanel">
    <!-- 已有的背景链接、上传、透明度、模糊等... -->
    
    <!-- 新增配置管理区域 -->
    <div class="config-row">
      <button class="config-btn" id="exportConfigBtn">📤 导出配置</button>
      <button class="config-btn" id="importConfigBtn">📥 导入配置</button>
      <input type="file" id="importFileInput" accept=".json">
    </div>
  </div>

  <script>
    // ... 原有 JS 全部保留 ...
    // 在 initFramework 末尾添加事件绑定

    // 导出配置
    function exportConfig() {
      const config = {};
      const keysToExport = [
        'glassAlpha', 'glassEnabled', 'cardGlassEnabled', 'bgDarken',
        'siteBgData', 'turingMagicTheme', 'categoryOrder_v1',
        'turingMagicFavorites_v2', 'pinnedFavorites'
      ];
      keysToExport.forEach(key => {
        const value = localStorage.getItem(key);
        if (value !== null) config[key] = value;
      });
      const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '趣网站配置.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // 导入配置
    function importConfig(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const config = JSON.parse(e.target.result);
          Object.entries(config).forEach(([key, value]) => {
            localStorage.setItem(key, value);
          });
          alert('配置导入成功，即将刷新页面。');
          location.reload();
        } catch (err) {
          alert('文件格式错误，导入失败。');
        }
      };
      reader.readAsText(file);
    }

    // 在 initFramework 中绑定事件
    document.getElementById('exportConfigBtn').addEventListener('click', exportConfig);
    const importBtn = document.getElementById('importConfigBtn');
    const importFile = document.getElementById('importFileInput');
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        importConfig(e.target.files[0]);
        e.target.value = ''; // 清空以便重复选择同一文件
      }
    });
  </script>
</body>
</html>
